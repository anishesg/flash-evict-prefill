[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-evict"
version = "0.1.0"
description = "Exact, linear-memory prefill importance with a fused tiled replay"
requires-python = ">=3.10"
dependencies = ["torch", "triton"]

[tool.setuptools.packages.find]
include = ["flash_evict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
